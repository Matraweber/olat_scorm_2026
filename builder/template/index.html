<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="html.title">SCORM Lerneinheit</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="katex/katex.min.css" />
  <script defer src="katex/katex.min.js"></script>
  <script defer src="katex/contrib/auto-render.min.js"></script>
</head>
<body>
  <div class="scorm-shell">
    <header class="scorm-header">
      <div class="brand-block">
        <div class="brand-text">
          <div class="brand-kicker" id="brandKicker" data-i18n="html.brandKicker">Umwelt-Campus Birkenfeld</div>
          <h1 id="courseTitle" data-i18n="html.courseTitle">SCORM Lerneinheit</h1>
          <p class="subtitle" id="courseSubtitle"></p>
          <nav class="top-nav" id="topNav" aria-label="Aufgabennavigation" data-i18n-aria="header.nav"></nav>
        </div>
        <img id="brandLogo" class="brand-logo hidden" alt="" />
      </div>
      <div class="scorm-lang-switcher hidden" id="scormLangSwitcher" role="group" aria-label="Language"></div>
    </header>

    <main class="scorm-main" id="scormMain">
      <div class="progress-bar-wrap" id="progressBarWrap" aria-label="Lernfortschritt" data-i18n-aria="progress.ariaLabel">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
        </div>
        <div class="progress-bar-text" id="progressBarText">Aufgabe 1 von 1</div>
      </div>
      <div id="taskContainer"></div>
    </main>

    <footer class="scorm-footer">
      <a class="footer-link" id="footerLink" href="#" target="_blank" rel="noopener noreferrer"></a>
    </footer>
  </div>

  <!-- DATA_SCRIPT -->
  <script src="scorm12.js"></script>
  <script src="utils.js"></script>
  <!-- I18N_SCRIPTS -->
  <script src="blocks/_registry.js"></script>
  <!-- BLOCK_SCRIPTS -->
  <script src="runtime.js"></script>
</body>
</html>
